<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page</title>
    <style>
        body { margin: 0; font-family: sans-serif; }
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: #bfd1ec;
        }
        h1 { font-size: 3rem; margin-bottom: 0.5rem; }
        p { font-size: 1.5rem; color: #555; margin-bottom: 2rem; }
        .btn {
            padding: 12px 24px;
            background-color: #007bff;
            color: rgb(255, 255, 255);
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <section class="hero">
        <h1>Prince Patrick</h1>
        <p>Creative Developer & Designer</p>
        <a href="#" class="btn">View My Projects</a>
    </section>
</body>
</html>
